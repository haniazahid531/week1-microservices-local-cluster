apiVersion: apps/v1
kind: Deployment
metadata:
  name: week5-alert-receiver
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week5-alert-receiver
  template:
    metadata:
      labels:
        app: week5-alert-receiver
    spec:
      containers:
        - name: webhook-receiver
          image: mendhak/http-https-echo:35
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: week5-alert-receiver
  namespace: monitoring
spec:
  selector:
    app: week5-alert-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
