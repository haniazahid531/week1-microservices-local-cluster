grafana:
  enabled: true
  adminUser: admin
  adminPassword: week5admin

  service:
    type: ClusterIP

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: week5-webhook
      group_by:
        - alertname
        - namespace
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h

    receivers:
      - name: "null"

      - name: week5-webhook
        webhook_configs:
          - url: http://week5-alert-receiver.monitoring.svc:8080/
            send_resolved: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

