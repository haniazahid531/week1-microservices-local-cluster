apiVersion: v1
kind: ConfigMap
metadata:
  name: week5-observability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  week5-observability.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps"
            }
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\"}[5m]))",
              "legendFormat": "Requests/second",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-reds"
              },
              "max": 100,
              "min": 0,
              "unit": "percent"
            }
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "editorMode": "code",
              "expr": "(100 * sum(rate(istio_requests_total{reporter=\"destination\",response_code=~\"5..\"}[5m])) / clamp_min(sum(rate(istio_requests_total{reporter=\"destination\"}[5m])), 0.001)) or vector(0)",
              "legendFormat": "5xx error percentage",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Error Rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-yellow-red"
              },
              "unit": "ms"
            }
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 3,
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[5m])) by (le))",
              "legendFormat": "P95 latency",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "P95 Request Latency",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 42,
      "tags": [
        "week5",
        "observability",
        "prometheus",
        "istio"
      ],
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Week 5 - Application Observability",
      "uid": "week5-observability",
      "version": 1
    }

