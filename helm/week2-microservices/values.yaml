backend:
  name: backend
  replicaCount: 1

  image:
    repository: week1-backend
    tag: v1
    pullPolicy: IfNotPresent

  containerPort: 8080

  service:
    name: backend-service
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  readinessProbe:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5

  livenessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

frontend:
  name: frontend
  replicaCount: 1

  image:
    repository: week1-frontend
    tag: v1
    pullPolicy: IfNotPresent

  containerPort: 8081
  backendUrl: http://backend-service:8080

  service:
    name: frontend-service
    type: ClusterIP
    port: 8081

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  readinessProbe:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5

  livenessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
