apiVersion: v1
kind: Pod
metadata:
  name: curl-injected
  namespace: week2
  labels:
    app: curl-injected
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: curl-uninjected
  namespace: week2
  labels:
    app: curl-uninjected
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sleep", "3600"]
