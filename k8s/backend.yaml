apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: week1
spec:
  replicas: 5
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: backend

  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: backend-success-rate

        - setWeight: 50
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: backend-success-rate

        - setWeight: 100

  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/haniazahid531/week1-microservices-local-cluster-backend:latest
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "canary-v2"
          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: week1
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
